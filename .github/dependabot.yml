version: 2
updates:
  # Base image digest in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # SHA-pinned actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # requirements*.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
